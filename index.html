<style>

<div id="app"><header><div class="av">D</div><div><b>Delytel Music AI</b><small>Tu manager digital · Chile 🇨🇱</small></div></header>
<div id="main"></div><div id="note"></div>

<script>
const SYS=`Eres Delytel, el manager musical del movimiento urbano chileno (reguetón, trap, drill, hip hop, dembow) dentro de la app Delytel Music AI. Hablas como un manager real y cercano por mensajes: español de Chile natural y profesional (un "oye" u "ojo" ocasional, sin caricatura), mensajes cortos (2 a 6 líneas), sin títulos, sin negritas ni listas salvo que te pidan un plan. Haz UNA pregunta a la vez. Si te preguntan directamente, reconoce que eres el manager digital (IA) de Delytel.
Dominas marketing musical, producción (beats, mezcla, master, estructura), audiovisual (videoclips, shorts, TikTok/Reels), lanzamientos, crecimiento por etapas, booking y cachés, contratos manager-artista, SCD, ISRC, splits, publishing, distribución, Content ID, playlisting, prensa, marcas, finanzas y equipo, con el contexto del mercado chileno (discotecas, municipios, productoras, radios, WhatsApp que hay que respaldar por escrito).
REGLA CLAVE: nunca halagues por halagar. Ante una idea: di qué funciona, qué es débil o genérico, cuestiona con una pregunta incisiva y propón una versión mejor y concreta. Si es mala, dilo con respeto y claridad. Usa la memoria que tienes del artista y recuérdasela de forma natural. No prometas fama; trabaja con metas medibles; separa el dinero del artista del del manager. No eres abogado ni contador (valida lo legal con un profesional). No inventes cifras exactas: da rangos referenciales. Rechaza comprar seguidores/streams o plagio. Si piden algo ajeno a la música, redirige amable. Si el artista necesita un documento, plan, presupuesto o cálculo, dile que lo genere en la pestaña Archivos.`;
const D=[["🔥","Estética callejera y cruda","Visuales de barrio, grano, luz natural, cero filtro."],["💎","Estética lujo y brillo","Joyas, autos, moda; un mundo aspiracional."],["🌑","Misterio y poca exposición","Que te conozcan por el sonido antes que por la cara."],["🎞️","Videoclip narrativo","Mini película con personajes y giro final."],["📱","Un video diario por 60 días","Constancia brutal en TikTok para ver qué pega."],["🤝","Colab con alguien más grande, aunque cobre","Invertir en visibilidad."],["🎤","Mini gira de 10 shows","Discotecas y municipios para foguearte en vivo."],["💿","EP de 5 temas antes que singles","Mostrar un universo completo."],["🇨🇱","Chilenismos fuertes y referencias locales","Identidad 100% de acá."],["🌎","Sonido más internacional","Pensar en playlists latinas y afuera."],["📻","Radios y medios locales","Prensa tradicional y relaciones con medios."],["🎬","Detrás de cámaras del estudio","Mostrar el proceso y la gente."],["🧢","Merch propio desde temprano","Ropa, gorras, identidad."],["🛠️","Primero producción y mezcla","Calidad de sonido antes que videos."]];
const T=[["Plan de lanzamiento","docx","Plan de lanzamiento de 4 semanas para mi próximo single, con tareas por semana, contenido y responsables."],["Presupuesto de lanzamiento","xlsx","Presupuesto de lanzamiento en CLP (producción, mezcla, master, videoclip, publicidad, imprevistos) con fórmulas de totales y 10% de imprevistos."],["Press kit (1 página)","pdf","Press kit de una página: bio, estilo, hitos, contacto y enlaces como campos a completar."],["Contrato manager–artista","docx","Borrador de contrato manager-artista para Chile: duración, comisión, exclusividad, gastos, rendición de cuentas, término y aviso de revisión por abogado."],["Calendario de contenido","xlsx","Calendario de contenido de 4 semanas para TikTok/Reels/Shorts con fecha relativa, formato, idea, objetivo y estado."],["Split sheet","pdf","Acuerdo de splits entre compositores, productor e intérprete, con campos para completar y firmas."]];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={p:null,chat:[],sw:{},notes:'',topic:'',last:0,prev:0,files:[],n:0},busy=false,tab='home',tm;
const note=t=>{const n=$('#note');n.textContent=t;n.style.display='block';clearTimeout(window._n);window._n=setTimeout(()=>n.style.display='none',12000)};
function sv(){clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem('delytel_v1',JSON.stringify(S))}catch(e){}},300)}
function go(t){tab=t;render()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));({home,swipe,chat:chatV,files:filesV})[tab]($('#main'))}
const opt=a=>a.map(x=>`<option>${x}</option>`).join('');
function home(m){const p=S.p;
if(!p){m.innerHTML=`<div class=pg><div class=card><h2>Ey, mucho gusto 👋</h2><p>Soy <b>Delytel</b>, tu manager digital. Antes de partir quiero conocerte un poco.</p><input id=pn placeholder="Tu nombre artístico"><select id=pg>${opt(['Reguetón','Trap','Drill','Hip hop','Dembow','Urbano / mezcla'])}</select><input id=pc placeholder="Ciudad o comuna"><select id=pe>${opt(['Recién empezando','Ya tengo música lanzada','Ya hago shows','Quiero dar el salto'])}</select><button class=btn onclick=onb()>Partamos</button></div></div>`;return}
const h=new Date().getHours(),g=h<6?'Ey, trasnochando':h<12?'Buenos días':h<20?'Buenas tardes':'Buenas noches',d=S.prev?Math.floor((Date.now()-S.prev)/864e5):null;
const l=!S.prev?'Primera vez por acá, vamos conociéndonos.':d>=1?`Hace ${d} día${d>1?'s':''} que no hablábamos.`:'Qué bueno verte de nuevo hoy.';
const pend=D.length-Object.keys(S.sw).length;
m.innerHTML=`<div class=pg><div class=card><h2>${g}, ${esc(p.n)} 👋</h2><p>${l} ${S.topic?`La última vez quedamos viendo: <b>“${esc(S.topic)}”</b>. ¿Seguimos con eso o hay algo nuevo?`:'Cuéntame qué estás armando y partimos.'}</p><div class=row><button class=btn onclick="go('chat')" style="margin-right:8px">Hablar con Delytel</button><button class=ghost onclick="go('swipe')">🔥 Descubre${pend?` (${pend})`:''}</button><button class=ghost onclick="go('files')">📁 Crear archivo</button></div></div>
<div class=card><h3>Lo que Delytel sabe de ti</h3><p style="white-space:pre-wrap">${S.notes?esc(S.notes):`Artista: ${esc(p.n)} · ${esc(p.g)} · ${esc(p.c||'Chile')}\nEtapa: ${esc(p.e)}\nAún nos estamos conociendo; mientras más hablemos, mejor te voy a entender.`}</p><button class=ghost onclick=forget()>Borrar memoria</button></div></div>`}
function onb(){const n=$('#pn').value.trim();if(!n){note('Dime tu nombre artístico');return}S.p={n,g:$('#pg').value,c:$('#pc').value.trim(),e:$('#pe').value};sv();render()}
function forget(){if(!confirm('¿Borrar todo lo que Delytel recuerda (notas y conversación)?'))return;S.notes='';S.topic='';S.chat=[];sv();render()}
function swipe(m){const L=D.map((_,i)=>i).filter(i=>!(i in S.sw));
if(!L.length){const y=Object.keys(S.sw).filter(k=>S.sw[k]).map(k=>D[k][1]);m.innerHTML=`<div class=pg><div class=card><h2>Tu ADN artístico 🧬</h2><p>Esto es lo que te mueve:</p><p>${y.length?y.map(x=>'✅ '+esc(x)).join('<br>'):'Descartaste todo, ¡eres exigente!'}</p><button class=btn onclick=adn()>Analizarlo con Delytel</button> <button class=ghost onclick="S.sw={};sv();render()">Repetir</button></div></div>`;return}
const c=i=>`<div class="sc" data-i=${i}><span class="st y">ME CABE</span><span class="st n">NEL</span><div class=e>${D[i][0]}</div><h2>${esc(D[i][1])}</h2><p class=mu>${esc(D[i][2])}</p></div>`;
m.innerHTML=`<div class=pg><p class=mu>Desliza a la derecha lo que te late y a la izquierda lo que no. Delytel aprende de tus gustos.</p><div class=deck>${L[1]!=null?c(L[1]).replace('class="sc"','class="sc bk"'):''}${c(L[0])}</div><div class=sb><button onclick="dec(${L[0]},0)">✕</button><button onclick="dec(${L[0]},1)">♥</button></div></div>`;
const el=m.querySelector('.sc:not(.bk)');let x0=0,dx=0,on=0;
el.onpointerdown=e=>{on=1;x0=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition='none'};
el.onpointermove=e=>{if(!on)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;el.querySelector(dx>0?'.y':'.n').style.setProperty('--o',Math.min(Math.abs(dx)/90,1))};
el.onpointerup=()=>{on=0;if(Math.abs(dx)>90)dec(L[0],dx>0?1:0);else{el.style.transition='transform .2s';el.style.transform='';el.querySelectorAll('.st').forEach(s=>s.style.setProperty('--o',0))}dx=0}}
function dec(i,y){S.sw[i]=y;sv();const el=$('.sc:not(.bk)');if(el){el.style.transition='transform .25s';el.style.transform=`translateX(${y?500:-500}px) rotate(${y?25:-25}deg)`}setTimeout(render,230)}
function adn(){const k=Object.keys(S.sw),y=k.filter(i=>S.sw[i]).map(i=>D[i][1]),n=k.filter(i=>!S.sw[i]).map(i=>D[i][1]);go('chat');send(`Hice el swipe. Me cabe: ${y.join('; ')||'nada'}. Descarté: ${n.join('; ')||'nada'}. ¿Qué lees de mí y por dónde partimos?`)}
const bub=(r,c)=>{const b=$('#msgs'),d=document.createElement('div');d.className='m '+r;d.innerHTML=(r==='m'?'<div class=av>D</div>':'')+'<div class=bb></div>';d.lastChild.textContent=c;b.appendChild(d);$('.pg').scrollTop=1e9;return d.lastChild};
function chatV(m){m.innerHTML=`<div class=pg><div id=msgs></div></div><div class=comp><textarea id=t rows=1 placeholder="Escríbele a Delytel…"></textarea><button class=btn onclick=send()>➤</button></div>`;
if(!S.chat.length)bub('m',`Ey ${S.p?S.p.n:''}, ¿cómo estás? Soy Delytel, tu manager. Cuéntame qué estás armando ahora: una canción, un lanzamiento, un show… y te digo con sinceridad qué veo.`);
S.chat.forEach(x=>bub(x.r,x.c));const t=$('#t');t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};t.oninput=()=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'}}
const clean=s=>s.replace(/[*#]/g,'');
function ctx(){const k=Object.keys(S.sw),y=k.filter(i=>S.sw[i]).map(i=>D[i][1]).join('; '),n=k.filter(i=>!S.sw[i]).map(i=>D[i][1]).join('; '),p=S.p||{};
return SYS+`\n\nARTISTA: ${p.n||'?'}, ${p.g||'?'}, ${p.c||'?'}, etapa: ${p.e||'?'}.\nMEMORIA: ${S.notes||'aún nada'}\nSWIPE - le gustó: ${y||'-'} | descartó: ${n||'-'}\nAhora: ${new Date().toLocaleString('es-CL')}.`}
async function send(txt){const t=$('#t'),v=(typeof txt==='string'?txt:t&&t.value||'').trim();if(!v||busy)return;if(!sample){note('Sin conexión. Revisa tu internet');return}
if(t){t.value='';t.style.height='auto'}busy=1;bub('u',v);S.chat.push({r:'u',c:v});const b=bub('m','');b.innerHTML='<span class=dots><i></i><i></i><i></i></span>';
let turns=S.chat.slice(-16).map(x=>({role:x.r==='u'?'user':'assistant',content:x.c}));while(turns[0]&&turns[0].role!=='user')turns.shift();turns[0].content=ctx()+'\n\n--- CONVERSACIÓN ---\n'+turns[0].content;
try{const r=await sample(turns,{cache:false,onText:({text})=>{if(b.isConnected){b.textContent=clean(text);$('.pg').scrollTop=1e9}}});const o=clean(r.text);b.textContent=o;S.chat.push({r:'m',c:o});S.chat=S.chat.slice(-30);S.n++;sv();if(S.n%2===0)mem()}
catch(e){b.parentNode.remove();S.chat.pop();note(e&&e.code==='not_granted'?'No pude conectar con Delytel.':e&&e.code==='rate_limited'?'Muchos mensajes seguidos, espera un momento.':'No pude responder ('+(e&&(e.status||e.code))+(e&&e.detail?': '+e.detail:'')+')')}
busy=0}
async function mem(){try{const j=await sample.json(`Eres Delytel, manager musical. Actualiza tus notas privadas sobre el artista.\nNotas actuales: ${S.notes||'ninguna'}\nÚltimos mensajes:\n${S.chat.slice(-8).map(x=>(x.r==='u'?'Artista: ':'Delytel: ')+x.c).join('\n')}\nResponde SOLO JSON: {"notes":"máximo 8 líneas cortas con hechos, metas, decisiones, pendientes y gustos del artista","topic":"tema de la última conversación en máximo 8 palabras"}`,{modelTier:'quick',cache:false});if(j&&j.notes){S.notes=String(j.notes).slice(0,1200);S.topic=String(j.topic||'').slice(0,80);sv()}}catch(e){}}
function filesV(m){m.innerHTML=`<div class=pg><div class=card><h2>Archivos 📁</h2><p class=mu>Pídele a Delytel documentos y cálculos ya personalizados con lo que sabe de ti.</p><div class=row>${T.map((x,i)=>`<button class=ghost onclick=tpl(${i})>${x[0]}</button>`).join('')}</div><textarea id=req rows=4 placeholder="O describe el archivo que necesitas…"></textarea><div style="margin-bottom:10px"><label class=rd><input type=radio name=f value=docx checked>Word</label><label class=rd><input type=radio name=f value=pdf>PDF</label><label class=rd><input type=radio name=f value=xlsx>Excel</label></div><button class=btn id=gb onclick=gen()>Crear archivo</button></div>${S.files.length?`<div class=card><h3>Creados</h3>${S.files.slice(-8).reverse().map(f=>`<p>📄 ${esc(f)}</p>`).join('')}</div>`:''}</div>`}
function tpl(i){$('#req').value=T[i][2];document.querySelector(`input[value=${T[i][1]}]`).checked=true}
const X=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),pl=s=>String(s).replace(/[–—]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[^\x20-\x7E\u00A0-\u00FF\n]/g,'');
const P=(t,o={})=>`<w:p><w:pPr><w:spacing w:after="${o.a||120}"/>${o.u?'<w:ind w:left="540" w:hanging="270"/>':''}</w:pPr><w:r><w:rPr>${o.b?'<w:b/>':''}${o.c?`<w:color w:val="${o.c}"/>`:''}<w:sz w:val="${o.s||22}"/></w:rPr><w:t xml:space="preserve">${X(t)}</w:t></w:r></w:p>`;
const bl=j=>(j.blocks||[]);
function mkDocx(j){const z=new JSZip(),H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
z.file('[Content_Types].xml',H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
z.file('_rels/.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
let b=P(j.title,{b:1,s:40,c:'E8431F',a:240});bl(j).forEach(x=>{if(x.h)b+=P(x.h,{b:1,s:28,c:'333333',a:100});if(x.p)b+=P(x.p);if(x.ul)x.ul.forEach(i=>b+=P('•  '+i,{u:1,a:60}))});

function mkPdf(j){const d=new jspdf.jsPDF({unit:'pt',format:'a4'});let y=60;const w=(t,sz,b,c,ind=0)=>{d.setFont('helvetica',b?'bold':'normal');d.setFontSize(sz);d.setTextColor(...c);d.splitTextToSize(pl(t),475-ind).forEach(l=>{if(y>785){d.addPage();y=60}d.text(l,60+ind,y);y+=sz*1.4});y+=4};
